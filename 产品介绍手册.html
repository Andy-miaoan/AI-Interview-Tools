<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI面试官 · 产品介绍手册 — 安迪 AI调度师</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #08080f; color: #e0e0e0; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
}
.container {
  text-align:center; padding:48px 24px; max-width:680px;
}
.logo { width:56px; height:56px; border-radius:14px; margin-bottom:16px; }
h1 { font-size:28px; font-weight:800; margin-bottom:8px; }
h1 span { background:linear-gradient(135deg,#60a5fa,#07c160); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub { font-size:14px; color:rgba(255,255,255,.4); margin-bottom:48px; line-height:1.8; }

.cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.card {
  background:rgba(17,31,24,.9); border:2px solid rgba(7,193,96,.15); border-radius:18px;
  padding:32px 24px; cursor:pointer; transition:.2s; text-decoration:none; color:inherit;
  display:block;
}
.card:hover { transform:translateY(-3px); border-color:rgba(7,193,96,.35); box-shadow:0 12px 40px rgba(7,193,96,.1); }
.card.blue { background:rgba(17,17,39,.9); border-color:rgba(91,110,255,.15); }
.card.blue:hover { border-color:rgba(91,110,255,.35); box-shadow:0 12px 40px rgba(91,110,255,.1); }

.card .icon { font-size:40px; margin-bottom:12px; }
.card h3 { font-size:20px; margin-bottom:8px; }
.card.green h3 { color:#07c160; }
.card.blue h3 { color:#5b6eff; }
.card .desc { font-size:13px; color:rgba(255,255,255,.4); line-height:1.7; }
.card .count { display:inline-block; padding:3px 12px; border-radius:12px; font-size:11px; margin-top:10px; }
.card.green .count { background:rgba(7,193,96,.1); color:#07c160; }
.card.blue .count { background:rgba(91,110,255,.1); color:#5b6eff; }

.back-link { display:inline-block; margin-top:36px; font-size:13px; color:rgba(255,255,255,.3); text-decoration:none; }
.back-link:hover { color:rgba(255,255,255,.6); }

@media(max-width:560px) { .cards { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container">
  <img class="logo" src="logo.png" alt="安迪 AI调度师" onerror="this.style.display='none'">
  <h1>AI<span>面试官</span> · 产品介绍手册</h1>
  <p class="sub">一套产品，两个版本。<br>选择你关注的一端，查看详细产品介绍。</p>

  <div class="cards">
    <a href="AI面试辅导/产品手册_AI面试辅导.html" class="card green">
      <div class="icon">🎯</div>
      <h3>AI面试辅导</h3>
      <div class="desc">候选人端 · 求职面试准备工具<br>简历优化 · 简历生成 · 模拟面试 · 谈薪指导 · 试用期护航</div>
      <span class="count">5个模块</span>
    </a>
    <a href="企业AI面试官/产品手册_企业AI面试官.html" class="card blue">
      <div class="icon">🏢</div>
      <h3>企业AI面试官</h3>
      <div class="desc">HR端 · 招聘面试管理工具<br>JD优化 · 简历筛选 · 面试题库 · 面试分析 · 谈薪策略 · 试用期管理 · 追踪看板</div>
      <span class="count">7个模块</span>
    </a>
  </div>

  <a href="javascript:history.back()" class="back-link">← 返回</a>
</div>
</body>
</html>
